# =============================================================================
# netdiag — coordinator (home LAN diagnostics)
# =============================================================================
#
# What this is:
#   A Docker Compose stack that runs for days on a Linux host with Docker Engine,
#   watches a handful of always-on "canary" devices, and writes HTML reports when
#   something looks broken (bad cable, dying unmanaged switch, rogue DHCP, etc.).
#
# Requirements:
#   - Linux + Docker Engine with host networking (not Docker Desktop on Windows/Mac)
#   - Capabilities NET_RAW + NET_ADMIN
#
# Setup (no wizard):
#   1. Copy config.example.yaml → config.yaml and edit the commented groups.
#   2. Edit the environment values below (IFACE, token, …).
#   3. docker compose up -d
#      (pulls ghcr.io/emil007/netdiag:latest — built on GitHub; do not build: here
#       unless you are developing the image yourself)
#
# Optional: the same compose file can be pasted into Portainer or any compose UI.
# Some UIs want an absolute host path for volumes instead of ./data.
#
# Image: ghcr.io/emil007/netdiag:latest  (linux/amd64 + linux/arm64)
# If the pull is unauthorized: docker login ghcr.io  — or make the GHCR package public.
# =============================================================================

services:
  analyzer:
    image: ghcr.io/emil007/netdiag:latest
    container_name: netdiag-analyzer
    # Host networking is required so fping/tcpdump see the real LAN.
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      # Timezone for logs/pcap filenames/display (IANA name).
      TZ: Europe/Berlin

      # NIC on THIS Docker host that faces the home LAN.
      # Find it with: ip -br link
      # Examples: eth0, enp3s0, wlan0 — do not guess.
      IFACE: eth0

      # Ingest token satellites must send. MUST NOT stay "change-me" in real use.
      # Generate something random. Must match satellite config coordinator.token.
      NETDIAG_INGEST_TOKEN: change-me

      # Optional: bind ingest to a specific address (default comes from config.yaml).
      # Prefer your LAN IP instead of 0.0.0.0 if the host also has WAN/VPN.
      # NETDIAG_INGEST_HOST: 192.168.1.10
      # NETDIAG_INGEST_PORT: "8787"

      # Lab only — allows empty/placeholder token (insecure).
      # NETDIAG_ALLOW_INSECURE_INGEST: "1"

      NETDIAG_DATA: /data
      NETDIAG_CONFIG: /app/config.yaml
    volumes:
      # Persistent reports, logs, SQLite, captures.
      # Portainer tip: use an absolute path, e.g. /srv/netdiag/data:/data
      - ./data:/data
      # Canaries, satellites, roles — edit config.yaml (copy from config.example.yaml).
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped

  capture:
    image: ghcr.io/emil007/netdiag:latest
    container_name: netdiag-capture
    command: ["capture"]
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      TZ: Europe/Berlin
      # Must match analyzer IFACE.
      IFACE: eth0
      NETDIAG_DATA: /data
      NETDIAG_CONFIG: /app/config.yaml
    volumes:
      - ./data:/data
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
