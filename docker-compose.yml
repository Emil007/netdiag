# =============================================================================
# netdiag — coordinator (home LAN diagnostics)
# =============================================================================
#
# Setup: edit THIS file only, then:
#   docker compose up -d
#
# Pulls ghcr.io/emil007/netdiag:latest (built on GitHub; linux/amd64 + arm64).
# Do not build: on the Docker host unless you are developing.
#
# Requires Linux Docker Engine + host networking (not Docker Desktop).
# Optional: paste into Portainer; some UIs want an absolute path for ./data.
# Ingest will not start until token ≠ change-me (unless NETDIAG_ALLOW_INSECURE_INGEST=1).
# =============================================================================

services:
  analyzer:
    image: ghcr.io/emil007/netdiag:latest
    container_name: netdiag-analyzer
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      # Host timezone (IANA). Also used for pcap filenames / report display.
      TZ: Europe/Berlin

      # NIC on THIS Docker host facing the LAN. Find with: ip -br link
      IFACE: eth0

      # Must match satellites. Replace change-me before real use.
      NETDIAG_INGEST_TOKEN: change-me

      # Optional: prefer LAN IP instead of 0.0.0.0 on multi-homed hosts
      # NETDIAG_INGEST_HOST: 192.168.1.10
      # NETDIAG_INGEST_PORT: "8787"
      # NETDIAG_ALLOW_INSECURE_INGEST: "1"

      NETDIAG_DATA: /data

      # -------------------------------------------------------------------------
      # Full netdiag config (nested YAML). Edit canaries / satellites / thresholds
      # here. Short overlays above (IFACE, TZ, token) still win when set.
      # Do NOT list this host's own IP as a canary. Canaries must answer ping.
      # -------------------------------------------------------------------------
      NETDIAG_CONFIG_YAML: |
        site:
          name: "Home LAN"
          timezone: Europe/Berlin

        vantage:
          id: coordinator
          link: ethernet          # ethernet | wifi
          availability: always
          # behind_switch: true   # set if this probe is behind an unmanaged switch
          #                       # (or use a same_segment canary — either shows local_switch on the map)
          note: "main probe on the home LAN"

        capture:
          iface: eth0             # overridden by IFACE when set
          snaplen: 256            # keep identical to capture service NETDIAG_SNAPLEN
          rotate_hours: 1
          keep_hours: 48          # keep identical to capture service NETDIAG_KEEP_HOURS

        ingest:
          enabled: true
          host: "0.0.0.0"
          port: 8787
          token: "change-me"      # overridden by NETDIAG_INGEST_TOKEN when set

        # Default none. Uncomment to enable triangulation.
        satellites: []
        # satellites:
        #   - id: sat-wired-1
        #     link: ethernet
        #     availability: always
        #     placement: router     # router | other
        #     note: "wired vantage nearer the router"
        #   - id: sat-wifi-1
        #     link: wifi
        #     availability: intermittent
        #     placement: other

        groups:
          # Primary router / ISP gateway (usually .1)
          - id: router
            role: gateway
            hosts: ["192.168.1.1"]

          # Optional mesh/AP management IPs (must answer ping)
          - id: mesh_a
            role: mesh
            hosts: ["192.168.1.2"]

          - id: mesh_b
            role: mesh
            hosts: ["192.168.1.3"]

          # Room/spur behind one unmanaged switch (group id appears in Where)
          # attach: gateway (default) | local_switch (only if that spur is on the probe's switch)
          - id: living_room
            role: branch
            # attach: gateway
            hosts: ["192.168.1.10", "192.168.1.11"]

          # Other always-on box on SAME switch as this probe (not this host)
          # Presence of same_segment also enables the inferred local_switch map node.
          - id: same_switch_as_probe
            role: same_segment
            hosts: ["192.168.1.12"]

          # Optional always-on Wi-Fi canary (prefer AP IPs over phones)
          - id: wifi_sample
            role: wifi
            hosts: ["192.168.1.50"]

          - id: internet
            role: external
            hosts: ["1.1.1.1", "8.8.8.8"]

        dhcp:
          expected_server_mac: ""

        dns:
          resolvers: ["192.168.1.1"]
          names: ["example.com", "cloudflare.com", "google.com"]

        thresholds:
          ping_interval_s: 5
          incident_clear_s: 60
          warmup_s: 150
          loss_threshold_pct: 50
          fail_rounds: 2
          confirm_rounds: 2
          dns_interval_s: 30
          dns_timeout_ms: 1500
          path_interval_s: 300
          bcast_pps_warn: 200
          satellite_stale_s: 45
          satellite_offline_after_s: 1200
          report_interval_s: 60

    volumes:
      # Reports / logs / captures. Portainer: absolute path often works better.
      - ./data:/data
    restart: unless-stopped

  capture:
    image: ghcr.io/emil007/netdiag:latest
    container_name: netdiag-capture
    command: ["capture"]
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      TZ: Europe/Berlin
      IFACE: eth0
      NETDIAG_DATA: /data
      # Keep these identical to analyzer capture.snaplen / keep_hours / rotate_hours
      # (avoid duplicating the full NETDIAG_CONFIG_YAML block here).
      NETDIAG_SNAPLEN: "256"
      NETDIAG_KEEP_HOURS: "48"
      NETDIAG_ROTATE_HOURS: "1"
    volumes:
      - ./data:/data
    restart: unless-stopped
