# =============================================================================
# netdiag — satellite (optional second vantage)
# =============================================================================
#
# Same published image as the coordinator. Lightweight: ping + NIC stats, no pcap.
# Pushes samples to the coordinator ingest URL.
#
# Typical uses on a home LAN:
#   - Wired host plugged into the router (availability: always) — confirms
#     "local switch vs uplink vs router".
#   - Wi-Fi host (availability: intermittent) — helps WIFI_PATH; may sleep.
#
# Setup:
#   1. Copy config.satellite.example.yaml → config.satellite.yaml and edit.
#   2. Edit IFACE / token overrides below if needed.
#   3. docker compose -f docker-compose.satellite.yml up -d
#
# Coordinator must list this satellite id under satellites: in its config.yaml
# (or it will be stored but not used for triangulation until listed).
# =============================================================================

services:
  satellite:
    image: ghcr.io/emil007/netdiag:latest
    container_name: netdiag-satellite
    command: ["satellite"]
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      TZ: Europe/Berlin

      # NIC on THIS satellite host (ip -br link). Use the Wi-Fi NIC if link is wifi.
      IFACE: eth0

      # Must match coordinator ingest.token. Not "change-me" in real use.
      NETDIAG_COORDINATOR_TOKEN: change-me

      # Optional override if you prefer env over config.satellite.yaml:
      # NETDIAG_COORDINATOR_URL: http://<coordinator-ip>:8787/ingest

      NETDIAG_DATA: /data
      NETDIAG_CONFIG: /app/config.yaml
    volumes:
      - ./data:/data
      - ./config.satellite.yaml:/app/config.yaml:ro
    restart: unless-stopped
