# =============================================================================
# netdiag — satellite (optional)
# =============================================================================
#
# Edit THIS file only, then:
#   docker compose -f docker-compose.satellite.yml up -d
#
# Same image as coordinator. List this vantage.id under satellites: on the
# coordinator NETDIAG_CONFIG_YAML (or it stays STATUS-only as unexpected).
# =============================================================================

services:
  satellite:
    image: ghcr.io/emil007/netdiag:latest
    container_name: netdiag-satellite
    command: ["satellite"]
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      TZ: Europe/Berlin
      # NIC on THIS host (ip -br link). Use wlan0 if link is wifi.
      IFACE: eth0

      # Must match coordinator NETDIAG_INGEST_TOKEN / ingest.token
      NETDIAG_COORDINATOR_TOKEN: change-me

      NETDIAG_DATA: /data

      NETDIAG_CONFIG_YAML: |
        site:
          name: "Home LAN"
          timezone: Europe/Berlin

        vantage:
          id: sat-wired-1           # must match coordinator satellites[].id
          link: ethernet            # ethernet | wifi
          availability: always      # wifi hosts: intermittent (may sleep)
          note: "optional wired vantage"
          # placement is declared on the *coordinator* satellites: list
          # (placement: router | other). Match that intent there.

        capture:
          iface: eth0

        coordinator:
          # LAN IP of the coordinator host
          url: "http://192.168.1.10:8787/ingest"
          token: "change-me"        # overridden by NETDIAG_COORDINATOR_TOKEN

        groups:
          - id: router
            role: gateway
            hosts: ["192.168.1.1"]
          - id: mesh_a
            role: mesh
            hosts: ["192.168.1.2"]
          - id: internet
            role: external
            hosts: ["1.1.1.1", "8.8.8.8"]

        dns:
          resolvers: ["192.168.1.1"]
          names: ["example.com", "cloudflare.com"]

        thresholds:
          ping_interval_s: 5
          dns_interval_s: 30
          dns_timeout_ms: 1500

    volumes:
      - ./data:/data
    restart: unless-stopped
