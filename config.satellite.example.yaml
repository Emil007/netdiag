# Docs-only mirror of docker-compose.satellite.yml NETDIAG_CONFIG_YAML.
# Prefer editing the compose file; no separate mount is required.
site:
  name: "Home LAN"
  timezone: Europe/Berlin

vantage:
  id: sat-wired-1
  link: ethernet
  availability: always
  note: "optional wired vantage"

capture:
  iface: eth0

coordinator:
  url: "http://192.168.1.10:8787/ingest"
  token: "change-me"

groups:
  - id: router
    role: gateway
    hosts: ["192.168.1.1"]
  - id: mesh_a
    role: mesh
    hosts: ["192.168.1.2"]
  - id: internet
    role: external
    hosts: ["1.1.1.1", "8.8.8.8"]

dns:
  resolvers: ["192.168.1.1"]
  names: ["example.com", "cloudflare.com"]

thresholds:
  ping_interval_s: 5
  dns_interval_s: 30
  dns_timeout_ms: 1500
