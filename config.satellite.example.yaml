# Docs-only mirror. Prefer docker-compose.satellite.yml.
# groups: must match the coordinator canary set for triangulation.
site:
  name: "Home LAN"
  timezone: Europe/Berlin

vantage:
  id: sat-wired-1
  link: ethernet
  availability: always
  note: "optional wired vantage"

capture:
  iface: eth0

coordinator:
  url: "http://192.168.1.10:8787/ingest"
  token: "change-me"

groups:
  - id: router
    role: gateway
    hosts: ["192.168.1.1"]
  - id: mesh_a
    role: mesh
    hosts: ["192.168.1.2"]
  - id: mesh_b
    role: mesh
    hosts: ["192.168.1.3"]
  - id: living_room
    role: branch
    hosts: ["192.168.1.10", "192.168.1.11"]
  - id: same_switch_as_probe
    role: same_segment
    hosts: ["192.168.1.12"]
  - id: wifi_sample
    role: wifi
    hosts: ["192.168.1.50"]
  - id: internet
    role: external
    hosts: ["1.1.1.1", "8.8.8.8"]

dns:
  resolvers: ["192.168.1.1"]
  names: ["example.com", "cloudflare.com"]

thresholds:
  ping_interval_s: 5
  dns_interval_s: 30
  dns_timeout_ms: 1500
