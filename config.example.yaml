# =============================================================================
# netdiag coordinator config — DOCS MIRROR only.
# Preferred setup: edit NETDIAG_CONFIG_YAML inside docker-compose.yml, then
#   docker compose up -d
# A separate config.yaml mount is optional (legacy / local pytest), not required.
# Canaries only (~5–15 always-on IPs). Not an inventory of every device.
# Do NOT list this Docker host's own IP as a canary.
# =============================================================================

site:
  name: "Home LAN"
  # Display timezone for reports (IANA). Container TZ should match for pcap names.
  timezone: Europe/Berlin

vantage:
  # Unique name for this probe host.
  id: coordinator
  # ethernet | wifi — how THIS host attaches to the LAN.
  link: ethernet
  # always | intermittent — ethernet probes should stay always.
  availability: always
  note: "main probe on the home LAN"

capture:
  # Overridden by compose IFACE when set. Find with: ip -br link
  iface: eth0
  snaplen: 256
  rotate_hours: 1
  # Old bcast-*.pcap files older than this are deleted.
  keep_hours: 48

ingest:
  enabled: true
  # Prefer your LAN IP on multi-homed hosts. 0.0.0.0 listens on all addresses.
  host: "0.0.0.0"
  port: 8787
  # REQUIRED: replace change-me. Satellites must use the same value.
  token: "change-me"

# Expected satellites (default: none). Uncomment and edit to enable triangulation.
# availability defaults: wifi → intermittent, ethernet → always.
satellites: []
# satellites:
#   - id: sat-wired-1
#     link: ethernet
#     availability: always
#     placement: router          # router | other — prefer this for uplink confirmation
#     note: "optional wired vantage nearer the router"
#   - id: sat-wifi-1
#     link: wifi
#     availability: intermittent
#     placement: other
#     note: "optional Wi-Fi vantage"

# Named canary groups — id is the name that appears in "Where" sentences.
groups:
  # Primary home router / ISP gateway. Usually .1 on the LAN.
  - id: router
    role: gateway
    hosts: ["192.168.1.1"]

  # Optional: each mesh node / AP management IP (must answer ping). Delete if unused.
  - id: mesh_a
    role: mesh
    hosts: ["192.168.1.2"]

  - id: mesh_b
    role: mesh
    hosts: ["192.168.1.3"]

  # Room/spur behind one unmanaged switch you care about (1–2 always-on boxes there).
  # The group id (e.g. living_room) is what reports will name.
  - id: living_room
    role: branch
    hosts: ["192.168.1.10", "192.168.1.11"]

  # CRITICAL if this host sits behind a dumb switch: another always-on device on
  # THAT SAME switch (not this host). Distinguishes local switch vs uplink to router.
  - id: same_switch_as_probe
    role: same_segment
    hosts: ["192.168.1.12"]

  # Optional Wi-Fi client canary (always-on). Prefer mesh node IPs over phones.
  - id: wifi_sample
    role: wifi
    hosts: ["192.168.1.50"]

  # Internet checks. ICMP may be blocked while HTTPS works — stack falls back to TCP/443.
  - id: internet
    role: external
    hosts: ["1.1.1.1", "8.8.8.8"]

dhcp:
  # Empty = learn first server Offer/ACK MAC (persisted). Or set your router's LAN MAC.
  expected_server_mac: ""

dns:
  resolvers: ["192.168.1.1"]
  names: ["example.com", "cloudflare.com", "google.com"]

thresholds:
  ping_interval_s: 5
  incident_clear_s: 60
  # Ignore satellite-derived faults this long after analyzer start.
  warmup_s: 150
  # Canary "down" if loss >= this % (or fail_rounds consecutive failures).
  loss_threshold_pct: 50
  fail_rounds: 2
  # Extra confirmation rounds before opening a ping-class incident.
  confirm_rounds: 2
  dns_interval_s: 30
  dns_timeout_ms: 1500
  path_interval_s: 300
  # Soft hint only; real storm uses learned baseline from capture counts.
  bcast_pps_warn: 200
  # Online if sample within this many seconds.
  satellite_stale_s: 45
  # Longer silence → offline (parked), not WIFI_PATH. 900–1800 recommended.
  satellite_offline_after_s: 1200
  report_interval_s: 60
